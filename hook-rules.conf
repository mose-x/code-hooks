# hook-rules.conf: single source of truth for code-hooks rules.
# Read at runtime by pre-commit / commit-msg / pre-push and the
# commit-lint CI workflow. Fail-closed: a missing or empty required
# section rejects the commit / push.
#
# Format:
#   - [section] header starts a section
#   - lines starting with # are comments, blank lines ignored
#   - inside a section, each non-comment line is one entry
#     (or key=value for the [rules] section)
#   - section order is not significant

[identities]
# Allowed commit author/committer identities.
# Format: `Display Name <email>`. Only the email is enforced; the name
# is informational and not checked. Same source read by pre-commit,
# pre-push, and the commit-lint CI workflow.
mose-zm <602187256@qq.com>

[allowed_branches]
# Branches allowed to be pushed (enforced by pre-push).
# - Exact match: literal branch name (e.g. `dev`).
# - Prefix match: ends with `*` (e.g. `dev-*` matches `dev-hotfix`).
#   Any other `*`, `?`, or `[...]` is treated as a literal character.
# Empty section -> all pushes rejected (fail-closed).
dev

[forbidden_tokens]
# Literal tokens forbidden in commit messages and annotated tag
# messages. Case-insensitive.
# Matched after normalizing non-alphanumeric chars to a single space,
# so `trae agent` / `trae-agent` / `TRAE AGENT` all hit the entry
# `trae agent`. The no-separator variant `traeagent` is listed
# separately because normalization keeps it as one word.
# Empty section -> all commits rejected (fail-closed).
trae agent
traeagent
co-authored by
coauthored by
generated by trae

[commit_types]
# Allowed conventional-commit types. One per line.
# Assembled into `(type1|type2|...)` regex by commit-msg.
feat
fix
refactor
perf
test
style
docs
ci
chore
build
revert

[rules]
# Scalar rules as key=value.
# max_subject_length: subject line char cap.
# max_total_message_length: subject + body char cap (UTF-8 codepoints).
max_subject_length=100
max_total_message_length=200

[lang_tools]
# Per-language toolchain. Format: lang:stage=command
#   lang  in {rust, go, nodejs, python, java}  (out-of-box configured)
#   stage in {fmt, lint, test}
# $FILES is substituted with the staged/changed file list (space-
# separated, auto-quoted). Leave value empty to disable a stage for a
# language (e.g. Java fmt/lint -- per-project style).
# Tool missing in PATH -> fail closed with an install hint.
# Empty/missing section -> all language tools skipped (docs-only fast
# path; fresh clones of code-hooks itself also skip).
#
# wails projects: detected as `go` + `nodejs` (both run); wails.json is
# not required for detection, only for which nodejs commands to configure.
#
# To enable another language (PHP, Perl, C#, Ruby, ...) see the
# "Adding or customizing a language" section in README.md -- the
# detector already recognises those suffixes, only the [lang_tools]
# entries need to be added here.

# --- Rust ---
rust:fmt=cargo fmt --check
rust:lint=cargo clippy --all-targets -- -D warnings
rust:test=cargo test --all

# --- Go (and wails backend) ---
go:fmt=gofmt -l $FILES
go:lint=go vet ./...
go:test=go test ./...

# --- Node.js (covers React / Vue / Svelte / Next / Nuxt / ...) ---
nodejs:fmt=npx prettier --check $FILES
nodejs:lint=npx eslint $FILES
nodejs:test=npm test

# --- Python ---
python:fmt=ruff format --check .
python:lint=ruff check .
python:test=pytest

# --- Java (fmt/lint intentionally empty: per-project style) ---
java:test=mvn test
# java:fmt=
# java:lint=
