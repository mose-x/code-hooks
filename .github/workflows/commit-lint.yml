# Reusable workflow: enforce commit message + identity rules on PR commits.
#
# Consumed by other repos via:
#   jobs:
#     commit-lint:
#       uses: mose-x/code-hooks/.github/workflows/commit-lint.yml@main
#
# CI backstop for the local hooks in this repo (commit-msg + pre-push).
# `git commit --no-verify` bypasses local hooks, so the PR is the last
# checkpoint before code lands on a protected branch. Rules run here are
# the single source of truth: the `commit-msg` script and the
# `hook-rules.conf` file are read at runtime from this repo's checkout,
# so updating them here updates enforcement for every consumer repo without
# touching their CI.
#
# This repo is public, so the runner clones it over unauthenticated
# HTTPS -- consumer repos need NO secrets, NO deploy key, NO PAT.
# Adoption is a single `uses:` line.
#
# Required status check name for branch protection: `commit-lint / commit-lint`.
name: commit-lint

on:
  workflow_call:
    # No inputs, no secrets. Parameter-free signature means consumer
    # repos adopt `uses: ...@main` with zero extra config.

permissions:
  contents: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    # Only meaningful on PRs: the scan range is the PR's base..head, and
    # push events to main carry already-merged squash merges
    # (committer=GitHub <noreply@github.com>) which would falsely trip
    # the identity check. Consumer repos typically also gate at the call
    # site with `if: github.event_name == 'pull_request'`, but guarding
    # here makes the workflow safe to wire into push-triggered CI too.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan walks every commit in the PR range via
          # `git rev-list --reverse BASE..HEAD`, which needs both refs
          # reachable. A shallow checkout would silently truncate the
          # range and skip linting commits beyond the fetch depth.
          fetch-depth: 0

      - name: Clone code-hooks (public, unauthenticated HTTPS)
        # Depth 1: only the hook scripts + hook-rules.conf are needed,
        # no history. @main is intentional so rule fixes propagate
        # immediately to all consumers without each repo bumping a
        # version pin. No deploy key needed since this repo is public.
        run: git clone --depth 1 https://github.com/mose-x/code-hooks.git /tmp/code-hooks

      - name: Lint commit messages + identities in PR range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          config_file=/tmp/code-hooks/hook-rules.conf
          if [ ! -f "$config_file" ]; then
            echo "commit-lint: reject" >&2
            echo "  $config_file not found." >&2
            exit 1
          fi

          # Extract a named section's entries (no [section] header, no
          # comments, no blank lines). Mirrors load-config.sh _section_lines.
          section_lines() {
            local section="$1"
            awk -v want="$section" '
              /^\[/ {
                in_section = ($0 == "[" want "]")
                next
              }
              in_section {
                line = $0
                sub(/#.*/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line != "") print line
              }
            ' "$config_file"
          }

          # Sanity-check required sections are present and non-empty.
          identities=$(section_lines identities)
          if [ -z "$identities" ]; then
            echo "commit-lint: reject" >&2
            echo "  [identities] section is missing or empty in hook-rules.conf." >&2
            echo "  fail closed by design." >&2
            exit 1
          fi

          # Extract allowed emails (one per line) from [identities].
          allowed_emails=$(printf '%s\n' "$identities" \
              | grep -oE '<[^>]+>' | tr -d '<>' \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          echo "Allowed emails:"
          printf '%s\n' "$allowed_emails" | sed 's/^/  /'

          echo "Scanning commits ${BASE:0:7}..${HEAD:0:7}"
          fail=0
          allowed_tmp=$(mktemp)
          printf '%s\n' "$allowed_emails" > "$allowed_tmp"
          for sha in $(git rev-list --reverse "$BASE..$HEAD"); do
            subj=$(git log -1 --format='%s' "$sha")
            echo "::group::$sha $subj"
            # 1. commit-msg rules: subject len, conventional prefix,
            #    ASCII-only, total <=200 chars, forbidden tokens.
            git log -1 --format='%B' "$sha" > /tmp/commit-msg.txt
            if ! /tmp/code-hooks/commit-msg /tmp/commit-msg.txt; then
              fail=1
            fi
            # 2. Identity: author AND committer email must be in the
            #    allowlist. Uses %ae/%ce (raw from the commit object) so
            #    rewritten history is caught too. Squash merges from
            #    GitHub carry committer=noreply@github.com but only appear
            #    on push events, not in the PR range, so the `if` guard
            #    above keeps them out of scope.
            ae=$(git log -1 --format='%ae' "$sha")
            ce=$(git log -1 --format='%ce' "$sha")
            if ! grep -Fxq -- "$ae" "$allowed_tmp" || ! grep -Fxq -- "$ce" "$allowed_tmp"; then
              echo "commit-lint: reject" >&2
              echo "  $sha: author=$ae committer=$ce" >&2
              echo "  allowed emails:" >&2
              sed 's/^/    /' "$allowed_tmp" >&2
              fail=1
            fi
            echo "::endgroup::"
          done
          rm -f "$allowed_tmp"
          exit $fail

      - name: Lint annotated tags in PR range
        # Backstop for pre-push validate_tag: catches annotated tags that
        # land in the PR range with a tagger email not in [identities] or
        # a message containing a forbidden token. Mirrors the local
        # hook's annotated-tag checks (tagger identity + ASCII + forbidden
        # tokens). Lightweight tags are skipped here -- they have no
        # tagger field and no message; their pointed-to commit identity is
        # already covered by the commit scan above.
        if: success() || failure()
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          config_file=/tmp/code-hooks/hook-rules.conf
          # Reuse the helper + allowlist extraction (idempotent, cheap).
          section_lines() {
            local section="$1"
            awk -v want="$section" '
              /^\[/ { in_section = ($0 == "[" want "]"); next }
              in_section {
                line = $0
                sub(/#.*/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line != "") print line
              }
            ' "$config_file"
          }

          identities=$(section_lines identities)
          allowed_emails=$(printf '%s\n' "$identities" \
              | grep -oE '<[^>]+>' | tr -d '<>' \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          allowed_tmp=$(mktemp)
          printf '%s\n' "$allowed_emails" > "$allowed_tmp"

          # Forbidden-token matcher: normalize non-alphanumeric runs to a
          # single space, lowercase, then word-boundary substring match.
          # Mirrors load-config.sh message_has_forbidden.
          normalize() { tr -c '[:alnum:]' ' ' | tr -s ' ' | tr 'A-Z' 'a-z'; }
          message_has_forbidden() {
            local msg="$1" norm tokens token tnorm
            norm=$(printf '%s' "$msg" | normalize)
            while IFS= read -r token; do
              tnorm=$(printf '%s' "$token" | normalize)
              if [ -n "$tnorm" ] && [[ " $norm " == *" $tnorm "* ]]; then
                return 0
              fi
            done < <(section_lines forbidden_tokens)
            return 1
          }

          # Find annotated tags whose target commit is in the PR range.
          # `git for-each-ref refs/tags` lists all tags; we keep those of
          # type `tag` (annotated) whose %(objectname) points into
          # BASE..HEAD. A tag created outside the PR range is not our concern.
          fail=0
          echo "Scanning annotated tags targeting ${BASE:0:7}..${HEAD:0:7}"
          range_commits=$(git rev-list "$BASE..$HEAD")
          while IFS=$'\t' read -r tag_name tag_obj target type; do
            [ "$type" = "tag" ] || continue
            # Is the tag's target commit within the PR range?
            case "$range_commits" in
              *"$target"*) ;;
              *) continue ;;
            esac
            echo "::group::tag $tag_name -> ${target:0:7}"
            # 1. Tagger email must be in the allowlist. %(taggeremail)
            #    returns `<email>` with angle brackets; strip them.
            tagger_email=$(git for-each-ref --format='%(taggeremail)' "refs/tags/$tag_name" \
                | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^<//; s/>$//')
            if [ -n "$tagger_email" ] && ! grep -Fxq -- "$tagger_email" "$allowed_tmp"; then
              echo "commit-lint: reject" >&2
              echo "  tag $tag_name tagger email '$tagger_email' not in allowlist." >&2
              echo "  allowed emails:" >&2
              sed 's/^/    /' "$allowed_tmp" >&2
              fail=1
            fi
            # 2. Message: ASCII-only + forbidden tokens.
            tag_msg=$(git for-each-ref --format='%(contents)' "refs/tags/$tag_name")
            if printf '%s' "$tag_msg" | LC_ALL=C tr -d '\000-\177' | grep -q .; then
              echo "commit-lint: reject" >&2
              echo "  tag $tag_name message contains non-ASCII characters; English only" >&2
              fail=1
            fi
            if message_has_forbidden "$tag_msg"; then
              echo "commit-lint: reject" >&2
              echo "  tag $tag_name message contains a forbidden token" >&2
              fail=1
            fi
            echo "::endgroup::"
          done < <(git for-each-ref --format='%(refname:short)%09%(objectname)%09%(*objectname)%09%(objecttype)' refs/tags)
          rm -f "$allowed_tmp"
          exit $fail
